<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #00c9ff, #92fe9d);
        }

        .register-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .register-box h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
            font-size: 28px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        .input-group label {
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        .input-group input {
            height: 45px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: #00aaff;
            box-shadow: 0 0 5px rgba(0, 170, 255, 0.5);
        }

        button {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 8px;
            background: #00aaff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #008ecc;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
        }

        .login-link a {
            text-decoration: none;
            color: #00aaff;
            font-size: 14px;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 450px) {
            .register-box {
                width: 90%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <form class="register-box" action="registration-page" method="post">

        <h1>Create Account</h1>

        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" placeholder="Enter your username">
        </div>

        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" placeholder="Enter your email">
        </div>

        <div class="input-group">
            <label for="password">Create Password</label>
            <input type="password" name="password" id="password" placeholder="Create a strong password">
        </div>

        <button type="submit">Register User</button>

        <div class="login-link">
            <a href="login-page">Already have an account? Login</a>
        </div>

    </form>

</body>

</html>
